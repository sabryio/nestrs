[package]
name = "purlin-otel"
description = "OpenTelemetry for purlin: OTLP export, W3C trace propagation across queues, and (feature `http`) HTTP server spans"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["http"]
## `HttpTracing`, the server-span interceptor. Turn it off for workers: telemetry export and
## queue propagation need no HTTP stack.
http = ["dep:purlin-http"]

[dependencies]
purlin-http = { workspace = true, optional = true }
purlin-jobs.workspace = true
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = "0.33.1"
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.34.0"
tracing-subscriber.workspace = true

[dev-dependencies]
purlin.workspace = true
opentelemetry_sdk = { version = "0.33.1", features = ["testing", "trace"] }
purlin-jobs.workspace = true
purlin-testing.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[test]]
name = "http"
required-features = ["http"]
