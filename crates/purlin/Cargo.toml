[package]
name = "purlin"
description = "NestJS-style modules, dependency injection and controllers for Rust, on top of Axum"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The compile-fail snapshots point into this workspace, so they only make sense here.
exclude = ["tests/ui", "tests/ui.rs"]

[features]
default = ["http"]
## The HTTP adapter: `App`, controllers, guards, `purlin::http`, `purlin::openapi`.
## Turn it off (`default-features = false`) for workers and other headless services.
http = ["dep:purlin-http"]

[dependencies]
async-trait = "0.1"
purlin-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
purlin-config.workspace = true
purlin-http = { workspace = true, optional = true }
purlin-macros.workspace = true
rust-fx.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
trybuild = "1"
utoipa.workspace = true
uuid.workspace = true
validator.workspace = true

[lints]
workspace = true

[[test]]
name = "http_features"
required-features = ["http"]

[[test]]
name = "macros"
required-features = ["http"]

[[test]]
name = "merge"
required-features = ["http"]

[[test]]
name = "modules"
required-features = ["http"]

[[test]]
name = "mount"
required-features = ["http"]

[[test]]
name = "openapi"
required-features = ["http"]

[[test]]
name = "status"
required-features = ["http"]

[[test]]
name = "syntax"
required-features = ["http"]

[[test]]
name = "websocket"
required-features = ["http"]

[[test]]
name = "ui"
required-features = ["http"]

[[test]]
name = "hosting_http"
required-features = ["http"]
