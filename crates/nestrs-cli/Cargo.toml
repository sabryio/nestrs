[package]
name = "nestrs-cli"
description = "The `nestrs` command: scaffolds projects and clean-architecture features"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "nestrs"
path = "src/main.rs"

[lib]
name = "nestrs_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
