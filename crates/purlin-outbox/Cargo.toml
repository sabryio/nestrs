[package]
name = "purlin-outbox"
description = "Transactional outbox for purlin: write events in the same transaction as your data, deliver them reliably"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["sea-orm", "jobs"]
# The SeaORM store, migration and in-transaction writer.
sea-orm = ["dep:purlin-sea-orm"]
# `QueuePublisher`, which delivers to a `purlin-jobs` queue.
jobs = ["dep:purlin-jobs"]

[dependencies]
purlin.workspace = true
purlin-sea-orm = { workspace = true, optional = true }
purlin-jobs = { workspace = true, optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
purlin-testing.workspace = true
purlin-sea-orm = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lints]
workspace = true
