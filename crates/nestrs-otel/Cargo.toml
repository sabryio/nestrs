[package]
name = "nestrs-otel"
description = "OpenTelemetry for nestrs: OTLP export, HTTP server spans, W3C trace propagation across queues"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
nestrs-http.workspace = true
nestrs-jobs.workspace = true
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = "0.33.1"
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.34.0"
tracing-subscriber.workspace = true

[dev-dependencies]
nestrs.workspace = true
opentelemetry_sdk = { version = "0.33.1", features = ["testing", "trace"] }
nestrs-jobs.workspace = true
nestrs-testing.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
