[package]
name = "purlin-fx"
description = "Adapter between purlin and rust-fx: run a purlin module graph and its HTTP server inside an fx application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["purlin", "fx", "dependency-injection", "lifecycle"]
categories = ["development-tools", "web-programming"]
readme = "README.md"

# This crate is the only place where the two frameworks meet. `purlin` does not depend on
# `rust-fx`, and `rust-fx` does not know `purlin`; both can be used (and published) alone.
[features]
default = ["http"]
## `serve` / `serve_with` / `HttpServer`: the HTTP transport as an fx component.
http = ["dep:purlin-http", "dep:tokio", "dep:tracing"]

[dependencies]
purlin-core.workspace = true
purlin-http = { workspace = true, optional = true }
rust-fx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
purlin = { workspace = true, features = ["http"] }
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "hosting_http"
required-features = ["http"]
