[workspace]
resolver = "3"
members = [
    "crates/purlin-cache",
    "crates/purlin-core",
    "crates/purlin-macros",
    "crates/purlin-http",
    "crates/purlin-bench",
    "crates/purlin-cli",
    "crates/purlin-config",
    "crates/purlin-health",
    "crates/purlin-interceptors",
    "crates/purlin-jobs",
    "crates/purlin-jwt",
    "crates/purlin-kit",
    "crates/purlin-otel",
    "crates/purlin-outbox",
    "crates/purlin-redis",
    "crates/purlin-sea-orm",
    "crates/purlin-testing",
    "crates/rust-fx",
    "crates/rust-fx-macros",
    "crates/purlin",
    "examples/blog-api",
    "examples/todo-minimal",
    "examples/headless-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/sabry-awad97/purlin"
homepage = "https://github.com/sabry-awad97/purlin"
documentation = "https://docs.rs/purlin"
authors = ["Sabry Awad"]
keywords = ["nestjs", "axum", "dependency-injection", "web", "framework"]
categories = ["web-programming", "web-programming::http-server"]

[workspace.dependencies]
# Internal crates
purlin-cache = { path = "crates/purlin-cache", version = "0.1.0" }
purlin-core = { path = "crates/purlin-core", version = "0.1.0" }
purlin-macros = { path = "crates/purlin-macros", version = "0.1.0" }
purlin-http = { path = "crates/purlin-http", version = "0.1.0" }
purlin-testing = { path = "crates/purlin-testing", version = "0.1.0" }
purlin-config = { path = "crates/purlin-config", version = "0.1.0" }
purlin-health = { path = "crates/purlin-health", version = "0.1.0", default-features = false }
purlin-interceptors = { path = "crates/purlin-interceptors", version = "0.1.0" }
purlin-jobs = { path = "crates/purlin-jobs", version = "0.1.0" }
purlin-jwt = { path = "crates/purlin-jwt", version = "0.1.0" }
purlin-redis = { path = "crates/purlin-redis", version = "0.1.0" }
purlin-kit = { path = "crates/purlin-kit", version = "0.1.0" }
purlin-otel = { path = "crates/purlin-otel", version = "0.1.0" }
purlin-outbox = { path = "crates/purlin-outbox", version = "0.1.0" }
purlin-sea-orm = { path = "crates/purlin-sea-orm", version = "0.1.0", default-features = false }
purlin = { path = "crates/purlin", version = "0.1.0", default-features = false }
rust-fx = { path = "crates/rust-fx", version = "0.1.0" }
rust-fx-macros = { path = "crates/rust-fx-macros", version = "0.1.0" }

# External crates
axum = "0.8"
http-body-util = "0.1"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.21", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = "line-tables-only"
