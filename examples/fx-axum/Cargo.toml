[package]
name = "fx-axum"
description = "A plain axum service wired with rust-fx only: no purlin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Deliberately absent: `purlin`. This is what rust-fx gives an ordinary axum app on its own:
# constructor injection, modules, ports, a group of controllers, and a server whose
# start and graceful stop are lifecycle hooks.
[dependencies]
axum.workspace = true
rust-fx.workspace = true
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
http-body-util.workspace = true
serde_json.workspace = true
tower.workspace = true

[lints]
workspace = true
