name: release
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  REQUIRE_REDIS: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Tag matches the workspace version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="purlin"))')
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in $(scripts/publish-order.sh); do
            echo "::group::$crate"
            # Re-running after a partial failure skips crates that already exist.
            out=$(cargo publish -p "$crate" 2>&1) || {
              echo "$out"
              echo "$out" | grep -q "already exists" || exit 1
            }
            echo "::endgroup::"
            sleep 20  # let the index propagate before dependents resolve it
          done
